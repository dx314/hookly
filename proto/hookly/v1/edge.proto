syntax = "proto3";

package hookly.v1;

import "hookly/v1/common.proto";

// EdgeService provides the API for managing endpoints and webhooks.
// Used by the UI and MCP server.
service EdgeService {
  // Endpoint management
  rpc CreateEndpoint(CreateEndpointRequest) returns (CreateEndpointResponse);
  rpc GetEndpoint(GetEndpointRequest) returns (GetEndpointResponse);
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse);
  rpc UpdateEndpoint(UpdateEndpointRequest) returns (UpdateEndpointResponse);
  rpc DeleteEndpoint(DeleteEndpointRequest) returns (DeleteEndpointResponse);

  // Destination management (an endpoint fans out to 1..N destinations)
  rpc AddDestination(AddDestinationRequest) returns (AddDestinationResponse);
  rpc UpdateDestination(UpdateDestinationRequest) returns (UpdateDestinationResponse);
  rpc RemoveDestination(RemoveDestinationRequest) returns (RemoveDestinationResponse);

  // Webhook management
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc ReplayWebhook(ReplayWebhookRequest) returns (ReplayWebhookResponse);

  // System status
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // User settings
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);

  // System settings (superuser only)
  rpc GetSystemSettings(GetSystemSettingsRequest) returns (GetSystemSettingsResponse);
}

// Endpoint requests/responses

message CreateEndpointRequest {
  string name = 1;
  ProviderType provider_type = 2;
  string signature_secret = 3;
  // Shorthand for a single destination named "default". Ignored when
  // destinations is set.
  string destination_url = 4;
  // Custom verification config (required for PROVIDER_TYPE_CUSTOM)
  VerificationConfig verification_config = 5;
  repeated DestinationInput destinations = 6;
}

message DestinationInput {
  string name = 1;
  string url = 2;
  optional bool enabled = 3; // Defaults to true
}

message CreateEndpointResponse {
  Endpoint endpoint = 1;
  string webhook_url = 2; // Full URL for provider configuration
}

message GetEndpointRequest {
  string id = 1;
}

message GetEndpointResponse {
  Endpoint endpoint = 1;
  string webhook_url = 2;
}

message ListEndpointsRequest {
  PaginationRequest pagination = 1;
}

message ListEndpointsResponse {
  repeated Endpoint endpoints = 1;
  PaginationResponse pagination = 2;
}

message UpdateEndpointRequest {
  string id = 1;
  optional string name = 2;
  optional string signature_secret = 3;
  optional string destination_url = 4; // Updates the primary destination's URL
  optional bool muted = 5;
  // Custom verification config (only for PROVIDER_TYPE_CUSTOM endpoints)
  VerificationConfig verification_config = 6;
}

message UpdateEndpointResponse {
  Endpoint endpoint = 1;
}

message DeleteEndpointRequest {
  string id = 1;
}

message DeleteEndpointResponse {}

// Destination requests/responses

message AddDestinationRequest {
  string endpoint_id = 1;
  string name = 2;
  string url = 3;
  optional bool enabled = 4; // Defaults to true
}

message AddDestinationResponse {
  Destination destination = 1;
  Endpoint endpoint = 2;
}

message UpdateDestinationRequest {
  string id = 1;
  optional string name = 2;
  optional string url = 3;
  optional bool enabled = 4;
}

message UpdateDestinationResponse {
  Destination destination = 1;
  Endpoint endpoint = 2;
}

message RemoveDestinationRequest {
  string id = 1;
}

message RemoveDestinationResponse {
  Endpoint endpoint = 1;
}

// Webhook requests/responses

message GetWebhookRequest {
  string id = 1;
}

message GetWebhookResponse {
  Webhook webhook = 1;
}

message ListWebhooksRequest {
  optional string endpoint_id = 1;
  optional WebhookStatus status = 2;
  PaginationRequest pagination = 3;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  PaginationResponse pagination = 2;
}

message ReplayWebhookRequest {
  string id = 1;
  // Replay to a single destination. Unset replays to every destination the
  // webhook was originally fanned out to.
  optional string destination_id = 2;
}

message ReplayWebhookResponse {
  Webhook webhook = 1;
}

// Status requests/responses

message GetStatusRequest {}

message GetStatusResponse {
  SystemStatus status = 1;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  string base_url = 1;
  bool github_auth_enabled = 2;
  bool telegram_notifications_enabled = 3;
  // User info (requires authentication)
  string user_id = 4;
  string username = 5;
  string avatar_url = 6;
  // User preferences
  ThemePreference theme_preference = 7;
  bool is_superuser = 8;
}

// User settings requests/responses

message GetUserSettingsRequest {}

message GetUserSettingsResponse {
  UserSettings settings = 1;
}

message UpdateUserSettingsRequest {
  // Telegram settings (all optional - only set fields are updated)
  optional string telegram_bot_token = 1;  // Write-only, encrypted at rest
  optional string telegram_chat_id = 2;
  optional bool telegram_enabled = 3;
  // UI preferences
  optional ThemePreference theme_preference = 4;
}

message UpdateUserSettingsResponse {
  UserSettings settings = 1;
}

// System settings requests/responses (superuser only)

message GetSystemSettingsRequest {}

message GetSystemSettingsResponse {
  SystemSettings settings = 1;
}
