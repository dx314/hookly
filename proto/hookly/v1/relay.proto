syntax = "proto3";

package hookly.v1;

import "google/protobuf/timestamp.proto";

// RelayService handles communication between edge and home-hub.
// The home-hub initiates a bidirectional stream to receive webhooks and send acks.
service RelayService {
  // Stream establishes a bidirectional stream.
  // Home-hub sends auth message, then receives webhooks.
  // Home-hub sends delivery acks to report delivery status.
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);
}

// Messages from home-hub to edge
message StreamRequest {
  oneof message {
    ConnectRequest connect = 1;
    DeliveryAck ack = 2;
    Heartbeat heartbeat = 3;
    HttpResponse http_response = 4;  // Answer to an HttpRequest (proxy)
  }
}

// Messages from edge to home-hub
message StreamResponse {
  oneof message {
    ConnectResponse connect_response = 1;
    WebhookEnvelope webhook = 2;
    Heartbeat heartbeat = 3;
    HttpRequest http_request = 4;  // Only sent to hubs with the "proxy" capability
  }
}

// Initial connection request with authentication
message ConnectRequest {
  string hub_id = 1;
  string token = 2;  // Bearer token from CLI login
  repeated string endpoint_ids = 3;  // Endpoints this hub handles
  // Optional features this hub understands. Hubs that predate a feature omit it.
  //   "fanout" - one envelope per (webhook, destination); acks echo delivery_id.
  //   "proxy"  - understands HttpRequest / HttpResponse (reverse proxy).
  // Hubs without "fanout" are only sent each endpoint's primary destination.
  // (4 is skipped: it was endpoint_ids before bearer-token auth.)
  repeated string capabilities = 5;
  // Names of the local services this hub reverse-proxies (the `proxies:`
  // section of hookly.yaml). The edge serves /p/{hub_id}/{name}/* for each
  // and never sends an HttpRequest for a name that is not listed here.
  repeated string proxies = 6;
}

// Connection response
message ConnectResponse {
  bool success = 1;
  string error = 2;
}

// Heartbeat for connection health monitoring
message Heartbeat {
  int64 timestamp = 1;
}

// Webhook envelope for delivery to home network
message WebhookEnvelope {
  string id = 1;
  string endpoint_id = 2;
  string destination_url = 3;
  google.protobuf.Timestamp received_at = 4;
  map<string, string> headers = 5;
  bytes payload = 6;
  int32 attempt = 7;
  // Fan-out: one envelope is sent per (webhook, destination). Older edges leave
  // these empty, older hubs ignore them.
  string delivery_id = 8;          // Echo in DeliveryAck.delivery_id
  string destination_id = 9;
  string destination_name = 10;    // Key for per-destination overrides in hookly.yaml
  bool destination_primary = 11;   // True for the endpoint's first destination
}

// Delivery acknowledgment from home-hub
message DeliveryAck {
  string webhook_id = 1;
  bool success = 2;
  int32 status_code = 3;
  string error_message = 4;
  bool permanent_failure = 5; // true for 4xx, don't retry
  // Echoed from WebhookEnvelope. Hubs that predate fan-out leave these empty and
  // the edge falls back to the webhook's primary (or only pending) delivery.
  string delivery_id = 6;
  string destination_id = 7;
}

// HttpHeader is one header line. Headers repeat (Set-Cookie), so this is a
// list rather than a map.
message HttpHeader {
  string name = 1;
  string value = 2;
}

// HttpRequest is a synchronous HTTP request the edge received at
// /p/{hub_id}/{proxy}/... and forwards to the hub's local service. The hub
// answers with an HttpResponse carrying the same request_id.
message HttpRequest {
  string request_id = 1;
  string proxy = 2;                 // Name from ConnectRequest.proxies
  string method = 3;
  string path = 4;                  // Already stripped of /p/{hub_id}/{proxy}; starts with "/"
  string raw_query = 5;             // Without the "?"
  repeated HttpHeader headers = 6;  // Hop-by-hop headers removed; X-Forwarded-* added
  bytes body = 7;
}

// HttpResponse is the local service's answer to an HttpRequest. When error is
// set the other fields are ignored and the edge answers 502.
message HttpResponse {
  string request_id = 1;
  int32 status = 2;
  repeated HttpHeader headers = 3;
  bytes body = 4;
  string error = 5;
}
